# Binding manifest — see https://github.com/EvergineTeam/Evergine.Bindings
toolbox: 1.25.0

package:
  id: Evergine.Bindings.Tracy
  project: Evergine.Bindings.Tracy/Evergine.Bindings.Tracy.csproj
  target-framework: net10.0
  runtime-identifier: ""

upstream:
  kind: git-tree
  language: c
  project: https://github.com/wolfpld/tracy
  version-from: git-release
  release:
    track: stable
    current: "v0.14.0"
    repo: wolfpld/tracy
  # TracyC.h includes ../common/TracyApi.h and ../common/TracyFormat.h, so the vendored
  # tree mirrors public/ far enough for those relative includes to resolve unchanged.
  sources:
    - repo: wolfpld/tracy
      remote-path: public/tracy/TracyC.h
      path: TracyGen/Headers/tracy/TracyC.h
      format: c-header
    - repo: wolfpld/tracy
      remote-path: public/common/TracyApi.h
      path: TracyGen/Headers/common/TracyApi.h
      format: c-header
    - repo: wolfpld/tracy
      remote-path: public/common/TracyFormat.h
      path: TracyGen/Headers/common/TracyFormat.h
      format: c-header

generator:
  project: TracyGen/TracyGen.csproj
  name: TracyGen
  output:
    - Evergine.Bindings.Tracy/Generated

# NOTE — the native libraries are compiled, not downloaded. Tracy's releases publish the
# profiler *viewer*; the client the package ships (TracyClient) exists only as source, one
# translation unit, built by the CD's natives job from the same tag this manifest records.
# Header and binaries must move as one revision, the same rule every native-shipping repo
# in the fleet follows.
#
# NOTE — TRACY_ENABLE is part of the package contract: without it, TracyC.h declares no
# functions at all. The generator's translation unit defines it before including, and the
# natives are compiled with it.
#
# NOTE — TRACY_ON_DEMAND is deliberately OFF, reversing the original design decision.
# Measured on v0.14.0 (2026-08-12): a shared-library build with on-demand drops all data
# a few frames after a server connects -- three frames and silence, against both a
# self-built and the official tracy-capture. Continuous recording works, resolves every
# zone, and additionally preserves history from before the viewer connects. The cost is
# that an instrumented application accumulates events in memory until one connects.
# Revisit if upstream fixes the on-demand DLL path.
#
# NOTE — the package binds the CPU client (zones, frames, plots, messages, thread names)
# plus the graphics-API-agnostic GPU emission layer. Locks and memory hooks are roadmap,
# not omissions.
